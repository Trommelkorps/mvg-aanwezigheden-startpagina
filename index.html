<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Met Vel en Gamel">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>Met Vel en Gamel · Aanwezigheden</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f6f2;color:#21352b;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.page{width:min(100%,420px);text-align:center;padding:32px 24px;background:#fff;border:1px solid #e5eae5;border-radius:18px;box-shadow:0 12px 34px #2746340d}.logo{display:block;width:142px;height:142px;object-fit:contain;margin:0 auto 20px;border-radius:22px}.name{font-size:25px;line-height:1.15;margin:0 0 8px;font-weight:750;letter-spacing:-.5px}.description{margin:0 0 24px;color:#718078;font-size:14px}.open{display:block;width:100%;padding:14px 18px;border-radius:10px;background:#28775a;color:#fff;text-decoration:none;font-size:16px;font-weight:700}.open:focus-visible{outline:3px solid #97c7ab;outline-offset:3px}.small{margin:16px 0 0;color:#87938b;font-size:12px}
  </style>
</head>
<body>
  <main class="page">
    <img class="logo" src="apple-touch-icon.png" alt="Logo van Met Vel en Gamel">
    <h1 class="name">Met Vel en Gamel</h1>
    <p class="description">Aanwezigheden en punten</p>
    <a class="open" id="openApp" href="https://script.google.com/macros/s/AKfycbxSCKxSuO0dESs6WFLe513wc_seDUXgKycwDQva8HMddCrLztd5e5WhbCncw_5lAjU/exec">Open de aanwezigheden</a>
    <p class="small">Tik hierboven om naar de invoerapp te gaan.</p>
  </main>
  <script>
    const appUrl = document.getElementById('openApp').href;
    document.getElementById('openApp').addEventListener('click', event => {
      event.preventDefault();
      const separator = appUrl.includes('?') ? '&' : '?';
      window.location.href = appUrl + separator + 'v=' + Date.now();
    });
  </script>
</body>
</html>
